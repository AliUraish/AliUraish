        <g transform="translate(24,30)"><g class="j jaw">
          <path class="k" d="M0,-6 L44,4 L44,15 L0,6 Z"/>
          <rect class="d" x="34" y="12" width="10" height="3"/>
          <circle class="d" r="2.5"/>
        </g></g>
        <rect class="k c1" x="56.0" y="-42.0" width="12" height="84" rx="2"/>
      </g></g>
    </g></g>
  </g></g>
  <rect class="k" x="-18" y="-18" width="42" height="36" rx="4"/><circle class="d" r="3"/>
</g>
<g class="c2"><g class="j gc">
  <rect class="k" x="-32.0" y="-42.0" width="64" height="84" rx="2" vector-effect="non-scaling-stroke"/>
  <g class="tx"><text class="t" y="-4">Hi, how</text><text class="t" y="13">are you?</text></g>
</g></g>
</svg>
