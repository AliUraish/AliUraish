<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="An SO-101 robot arm picking up a box that says: Hi, how are you?">
  <title>SO-101 arm picking up a box that says “Hi, how are you?”</title>
  
<style>
  .j{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.2,1)}
  .s{animation-name:sh} .e{animation-name:el} .w{animation-name:wr}
  .fa{animation-name:fA} .fb{animation-name:fB}
  .cg{animation:cg 12s infinite linear} .ch{animation:ch 12s infinite linear}
  @keyframes sh{0%{transform:rotate(-105deg)}22%{transform:rotate(-18.03deg)}28%{transform:rotate(-18.03deg)}45%{transform:rotate(-89.26deg)}62%{transform:rotate(-89.26deg)}78%{transform:rotate(-18.03deg)}84%{transform:rotate(-18.03deg)}100%{transform:rotate(-105deg)}} @keyframes el{0%{transform:rotate(125deg)}22%{transform:rotate(32.13deg)}28%{transform:rotate(32.13deg)}45%{transform:rotate(79.66deg)}62%{transform:rotate(79.66deg)}78%{transform:rotate(32.13deg)}84%{transform:rotate(32.13deg)}100%{transform:rotate(125deg)}} @keyframes wr{0%{transform:rotate(70deg)}22%{transform:rotate(75.9deg)}28%{transform:rotate(75.9deg)}45%{transform:rotate(99.6deg)}62%{transform:rotate(99.6deg)}78%{transform:rotate(75.9deg)}84%{transform:rotate(75.9deg)}100%{transform:rotate(70deg)}} @keyframes fA{0%,22%{transform:translateY(0)}28%,78%{transform:translateY(11px)}84%,100%{transform:translateY(0)}} @keyframes fB{0%,22%{transform:translateY(0)}28%,78%{transform:translateY(-11px)}84%,100%{transform:translateY(0)}} @keyframes cg{0%,27.9%{opacity:1}28%,83.9%{opacity:0}84%,100%{opacity:1}} @keyframes ch{0%,27.9%{opacity:0}28%,83.9%{opacity:1}84%,100%{opacity:0}}
  .k{fill:#000;stroke:#fff;stroke-width:2.5;stroke-linejoin:round}
  .d{fill:#fff} .t{font:700 14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#fff;text-anchor:middle}
  .m{font:11px ui-monospace,Menlo,Consolas,monospace;fill:#666}
</style>
  <rect width="800" height="320" rx="12" fill="#000"/>
  <line x1="60" y1="262" x2="740" y2="262" stroke="#333" stroke-width="2"/>

  <!-- box on the ground -->
  <g class="cg" transform="translate(455,234.0)">
      <rect class="k" x="-42.0" y="-28.0" width="84" height="56" rx="4"/>
      <text class="t" x="0" y="-3">Hi, how</text><text class="t" x="0" y="15">are you?</text>
    </g>

  <!-- base -->
  <rect class="k" x="130" y="240" width="170" height="22" rx="4"/>
  <rect class="k" x="196" y="206" width="38" height="40" rx="4"/>
  <circle class="d" cx="150" cy="251" r="2"/><circle class="d" cx="280" cy="251" r="2"/>

  <!-- shoulder -->
  <g transform="translate(215,200)">
    <g class="j s">
      <path class="k" d="M0,-13 L130,-8 L130,8 L0,13 Z"/>
      <rect class="k" x="-18" y="-18" width="42" height="36" rx="4"/>
      <circle class="d" cx="0" cy="0" r="3"/>
      <!-- elbow -->
      <g transform="translate(130,0)">
        <g class="j e">
          <path class="k" d="M0,-10 L120,-7 L120,7 L0,10 Z"/>
          <rect class="k" x="-14" y="-15" width="30" height="30" rx="4"/>
          <circle class="d" cx="0" cy="0" r="3"/>
          <rect class="k" x="94" y="-14" width="30" height="28" rx="4"/>
          <!-- wrist / gripper -->
          <g transform="translate(120,0)">
            <g class="j w">
              <rect class="k" x="-4" y="-20" width="28" height="40" rx="4"/>
              <circle class="d" cx="0" cy="0" r="3"/>
              <rect class="k" x="18" y="-62" width="10" height="124" rx="3"/>
              <g class="j fa"><rect class="k" x="22" y="-61" width="50" height="6" rx="2"/><rect class="d" x="60" y="-55" width="10" height="3"/></g>
              <g class="j fb"><rect class="k" x="22" y="55" width="50" height="6" rx="2"/><rect class="d" x="60" y="52" width="10" height="3"/></g>
              <g class="ch" transform="translate(45,0) rotate(-90)">
      <rect class="k" x="-42.0" y="-28.0" width="84" height="56" rx="4"/>
      <text class="t" x="0" y="-3">Hi, how</text><text class="t" x="0" y="15">are you?</text>
    </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <text class="m" x="60" y="292">SO-101</text>
  <text class="m" x="740" y="292" text-anchor="end">Ali Uraish</text>
</svg>
