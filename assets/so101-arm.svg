<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="A robot arm picks up a flat sign from a stand, turns it upright, and shows the words: Hi, how are you?">
<style>
.j{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.2,1)}
.s{animation-name:sh}.e{animation-name:el}.w{animation-name:wr}.ja{animation-name:jA}.jb{animation-name:jB}.face{animation-name:fc}
.cg{animation:cg 8s infinite linear}.ch{animation:ch 8s infinite linear}.tx{animation:tx 8s infinite linear}
@keyframes sh{0%{transform:rotate(-105deg)}16%{transform:rotate(-44.91deg)}24%{transform:rotate(-40.1deg)}29%{transform:rotate(-40.1deg)}37%{transform:rotate(-55.88deg)}50%{transform:rotate(-65.65deg)}66%{transform:rotate(-65.65deg)}76%{transform:rotate(-55.88deg)}84%{transform:rotate(-40.1deg)}88%{transform:rotate(-40.1deg)}94%{transform:rotate(-44.91deg)}100%{transform:rotate(-105deg)}}@keyframes el{0%{transform:rotate(125deg)}16%{transform:rotate(123.89deg)}24%{transform:rotate(106.23deg)}29%{transform:rotate(106.23deg)}37%{transform:rotate(107.15deg)}50%{transform:rotate(119.14deg)}66%{transform:rotate(119.14deg)}76%{transform:rotate(107.15deg)}84%{transform:rotate(106.23deg)}88%{transform:rotate(106.23deg)}94%{transform:rotate(123.89deg)}100%{transform:rotate(125deg)}}@keyframes wr{0%{transform:rotate(70deg)}16%{transform:rotate(-78.98deg)}24%{transform:rotate(-66.13deg)}29%{transform:rotate(-66.13deg)}37%{transform:rotate(-51.27deg)}50%{transform:rotate(-143.48deg)}66%{transform:rotate(-143.48deg)}76%{transform:rotate(-51.27deg)}84%{transform:rotate(-66.13deg)}88%{transform:rotate(-66.13deg)}94%{transform:rotate(-78.98deg)}100%{transform:rotate(70deg)}}
@keyframes jA{0%,24%{transform:translateY(0)}29%,84%{transform:translateY(12px)}88%,100%{transform:translateY(0)}}
@keyframes jB{0%,24%{transform:translateY(0)}29%,84%{transform:translateY(-12px)}88%,100%{transform:translateY(0)}}
@keyframes fc{0%,39%{transform:scale(1,0.1875)}50%,66%{transform:scale(1,1)}75%,100%{transform:scale(1,0.1875)}}
@keyframes tx{0%,44%{opacity:0}50%,66%{opacity:1}71%,100%{opacity:0}}
@keyframes cg{0%,28.9%{opacity:1}29%,87.9%{opacity:0}88%,100%{opacity:1}}
@keyframes ch{0%,28.9%{opacity:0}29%,87.9%{opacity:1}88%,100%{opacity:0}}
.k{fill:#000;stroke:#fff;stroke-width:2.5;stroke-linejoin:round}.d{fill:#fff}
.t{font:700 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#fff;text-anchor:middle}
</style>
<rect width="800" height="320" rx="12" fill="#000"/>
<line x1="60" y1="262" x2="740" y2="262" stroke="#333" stroke-width="2"/>
<rect class="k" x="430" y="232" width="70" height="30" rx="2"/>
<rect class="k cg" x="413.0" y="220.0" width="84" height="12" rx="2"/>
<rect class="k" x="130" y="240" width="170" height="22" rx="4"/>
<rect class="k" x="196" y="206" width="38" height="40" rx="4"/>
<circle class="d" cx="150" cy="251" r="2"/><circle class="d" cx="280" cy="251" r="2"/>
<g transform="translate(215,200)"><g class="j s">
  <path class="k" d="M0,-13 L130,-8 L130,8 L0,13 Z"/>
  <rect class="k" x="-18" y="-18" width="42" height="36" rx="4"/><circle class="d" r="3"/>
  <g transform="translate(130,0)"><g class="j e">
    <path class="k" d="M0,-10 L120,-7 L120,7 L0,10 Z"/>
    <rect class="k" x="-14" y="-15" width="30" height="30" rx="4"/><circle class="d" r="3"/>
    <rect class="k" x="94" y="-14" width="30" height="28" rx="4"/>
    <g transform="translate(120,0)"><g class="j w">
      <rect class="k" x="-4" y="-18" width="28" height="36" rx="4"/><circle class="d" r="3"/>
      <rect class="k" x="18" y="-32" width="10" height="64" rx="1"/>
      <circle class="d" cx="23" cy="-25" r="1.5"/><circle class="d" cx="23" cy="25" r="1.5"/>
      <g class="j ja"><path class="k" d="M22,-30 L50,-30 L66,-17 L66,-20 L22,-20 Z"/><rect class="d" x="48" y="-22" width="16" height="2"/></g>
      <g class="j jb"><path class="k" d="M22,30 L50,30 L66,17 L66,20 L22,20 Z"/><rect class="d" x="48" y="20" width="16" height="2"/></g>
      <g class="ch" transform="translate(92,0)"><g class="j face">
        <rect class="k" x="-42.0" y="-32.0" width="84" height="64" rx="2" vector-effect="non-scaling-stroke"/>
        <g class="tx" transform="rotate(90)"><text class="t" y="-4">Hi, how</text><text class="t" y="13">are you?</text></g>
      </g></g>
    </g></g>
  </g></g>
</g></g>
</svg>
