<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="A robot arm picks up a flat sign, lifts it, rotates on its base to face the viewer, and shows the words: Hi, how are you?">
<style>
.j{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.2,1)}
.s{animation-name:sh}.e{animation-name:el}.w{animation-name:wr}.jaw{animation-name:jw}.yaw{animation-name:yw}.gc{animation-name:gc}
.c0{animation:c0 9s infinite linear}.c1{animation:c1 9s infinite linear}.c2{animation:c2 9s infinite linear}.tx{animation:tx 9s infinite linear}
@keyframes sh{0%{transform:rotate(-105deg)}13%{transform:rotate(-22.62deg)}19%{transform:rotate(-16.98deg)}24%{transform:rotate(-16.98deg)}31%{transform:rotate(-36.12deg)}40%{transform:rotate(-59.01deg)}50%{transform:rotate(-59.01deg)}64%{transform:rotate(-59.01deg)}73%{transform:rotate(-59.01deg)}80%{transform:rotate(-36.12deg)}86%{transform:rotate(-16.98deg)}90%{transform:rotate(-16.98deg)}94%{transform:rotate(-22.62deg)}100%{transform:rotate(-105deg)}}@keyframes el{0%{transform:rotate(125deg)}13%{transform:rotate(22.62deg)}19%{transform:rotate(32.42deg)}24%{transform:rotate(32.42deg)}31%{transform:rotate(36.9deg)}40%{transform:rotate(69.31deg)}50%{transform:rotate(69.31deg)}64%{transform:rotate(69.31deg)}73%{transform:rotate(69.31deg)}80%{transform:rotate(36.9deg)}86%{transform:rotate(32.42deg)}90%{transform:rotate(32.42deg)}94%{transform:rotate(22.62deg)}100%{transform:rotate(125deg)}}@keyframes wr{0%{transform:rotate(70deg)}13%{transform:rotate(90deg)}19%{transform:rotate(74.55deg)}24%{transform:rotate(74.55deg)}31%{transform:rotate(89.22deg)}40%{transform:rotate(-10.29deg)}50%{transform:rotate(-10.29deg)}64%{transform:rotate(-10.29deg)}73%{transform:rotate(-10.29deg)}80%{transform:rotate(89.22deg)}86%{transform:rotate(74.55deg)}90%{transform:rotate(74.55deg)}94%{transform:rotate(90deg)}100%{transform:rotate(70deg)}}
@keyframes jw{0%,19%{transform:rotate(38deg)}24%,86%{transform:rotate(0deg)}90%,100%{transform:rotate(38deg)}}
@keyframes yw{0%,40%{transform:scale(1,1)}50%,64%{transform:scale(0.15,1)}73%,100%{transform:scale(1,1)}}
@keyframes gc{0%,40%{transform:translate(462px,110px) scale(0.1875,1)}50%,64%{transform:translate(252.05px,110px) scale(1,1)}73%,100%{transform:translate(462px,110px) scale(0.1875,1)}}
@keyframes c0{0%,23.9%{opacity:1}24%,89.9%{opacity:0}90%,100%{opacity:1}}
@keyframes c1{0%,23.9%{opacity:0}24%,39.9%{opacity:1}40%,73%{opacity:0}73.1%,89.9%{opacity:1}90%,100%{opacity:0}}
@keyframes c2{0%,39.9%{opacity:0}40%,73%{opacity:1}73.1%,100%{opacity:0}}
@keyframes tx{0%,46%{opacity:0}50%,64%{opacity:1}68%,100%{opacity:0}}
.k{fill:#000;stroke:#fff;stroke-width:2.5;stroke-linejoin:round}.d{fill:#fff}
.t{font:700 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#fff;text-anchor:middle}
</style>
<rect width="800" height="320" rx="12" fill="#000"/>
<line x1="60" y1="262" x2="740" y2="262" stroke="#333" stroke-width="2"/>
<rect class="k c0" x="413.0" y="250.0" width="84" height="12" rx="2"/>
<rect class="k" x="130" y="240" width="170" height="22" rx="4"/>
<rect class="k" x="196" y="206" width="38" height="40" rx="4"/>
<circle class="d" cx="150" cy="251" r="2"/><circle class="d" cx="280" cy="251" r="2"/>
<g transform="translate(215,200)">
  <g class="j yaw"><g class="j s">
    <path class="k" d="M0,-13 L130,-8 L130,8 L0,13 Z"/>
    <g transform="translate(130,0)"><g class="j e">
      <path class="k" d="M0,-10 L120,-7 L120,7 L0,10 Z"/>
      <rect class="k" x="-14" y="-15" width="30" height="30" rx="4"/><circle class="d" r="3"/>
      <rect class="k" x="94" y="-14" width="30" height="28" rx="4"/>
      <g transform="translate(120,0)"><g class="j w">
        <rect class="k" x="-4" y="-22" width="30" height="44" rx="4"/><circle class="d" r="3"/>
        <rect class="k" x="16" y="-54" width="14" height="76" rx="3"/>
        <path class="k" d="M22,-52 L68,-50 L68,-44 L22,-44 Z"/>
        <rect class="d" x="58" y="-47" width="10" height="3"/>
